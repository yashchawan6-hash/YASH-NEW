name: Shopify Multi-Website Real-Time Sales Tracker

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-tracker]

permissions:
  contents: write

concurrency:
  group: sales-tracker-group
  cancel-in-progress: true

jobs:
  track-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sales Tracker Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python shopify_sales_tracker.py

      - name: Commit and Push Updated Stock States
        run: |
          git config --global user.name "Shopify Sales Tracker Bot"
          git config --global user.email "bot@github-actions.local"
          
          # Fetch latest remote state before staging
          git fetch origin main
          
          git add state/ daily_sales/
          if git diff --staged --quiet; then
            echo "No stock inventory state changes to commit."
          else
            git commit -m "Automated update: Stock state inventory snapshot [skip ci]"
            
            pushed=0
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "Successfully pushed state updates to main!"
                pushed=1
                break
              fi
              echo "Push failed. Merging remote changes with -X ours strategy..."
              git fetch origin main
              git merge -X ours origin/main --no-edit -m "Merge remote changes [skip ci]" || (git merge --abort && git reset --soft origin/main && git add state/ daily_sales/ && git commit -m "Automated update: Stock state inventory snapshot [skip ci]")
              sleep 2
            done
            
            if [ $pushed -eq 0 ]; then
              echo "Failed to push state updates after 5 attempts."
              exit 1
            fi
          fi
