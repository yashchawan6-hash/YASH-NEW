name: Shopify Multi-Website Real-Time Sales Tracker

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sales Tracker Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python shopify_sales_tracker.py

      - name: Commit and Push Updated Stock States
        run: |
          git config --global user.name "Shopify Sales Tracker Bot"
          git config --global user.email "bot@github-actions.local"
          git add state/
          if git diff --staged --quiet; then
            echo "No stock inventory state changes to commit."
          else
            git commit -m "Automated update: Stock state inventory snapshot [skip ci]"
            git push
          fi
